<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>S&M Badminton Admin</title><style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f3f4f6;padding-bottom:70px;color:#111827}button,input,textarea,select{font:inherit}.slot{width:100%;min-height:62px;border-radius:10px;border:1px solid #bbf7d0;background:#f0fdf4;color:#166534;font-weight:900;cursor:pointer;padding:6px;font-size:11px}.available{background:#eff6ff!important;border-color:#93c5fd!important;color:#1d4ed8!important}.past{background:#f3f4f6!important;border-color:#e5e7eb!important;color:#9ca3af!important}.modal{position:fixed;inset:0;background:rgba(0,0,0,.48);display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.open{display:flex}.sheet{width:min(680px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:16px}.field{margin-bottom:10px}.field label{display:block;font-weight:700;margin-bottom:4px}.field input,.field textarea,.field select{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:10px;background:#fff}.field textarea{min-height:70px}.row{display:flex;gap:8px}.row>*{flex:1}.green,.blue,.orange,.red,.gray{border:0;border-radius:9px;padding:10px 12px;font-weight:800;cursor:pointer}.green{background:#16a34a;color:#fff}.blue{background:#2563eb;color:#fff}.orange{background:#f59e0b;color:#fff}.red{background:#dc2626;color:#fff}.gray{background:#eef2f7;color:#374151}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}.menu button{padding:11px;border:0;border-radius:10px;background:#fff;font-weight:800;box-shadow:0 1px 3px #ddd}.hint{font-size:12px;color:#6b7280}.error{color:#b91c1c;margin-top:8px}.ok{color:#15803d;margin-top:8px}
</style></head><body>
<header style="background:#111827;color:#fff;padding:16px"><h1 style="margin:0;font-size:20px">🏸 S&M Badminton Admin</h1><p style="margin:4px 0 0;font-size:13px">ตาราง 4 สนาม • กดว่างเพื่อจอง • กดรายการเพื่อแก้ไข</p></header>
<main style="max-width:1100px;margin:auto;padding:10px">
<div id="loginView"><h2>🔐 Admin</h2><input id="adminPassword" type="password" placeholder="รหัส Admin" style="width:100%;padding:12px"><button id="loginBtn" type="button" class="blue" style="width:100%;margin-top:8px">เข้าสู่ระบบ</button><div id="loginError" class="error"></div></div>
<div id="appView" style="display:none"><div style="margin:10px 0;display:flex;gap:6px;flex-wrap:wrap"><button id="prevBtn">◀</button><input id="date" type="date" style="padding:7px"><button id="nextBtn">▶</button><button id="todayBtn">วันนี้</button><button id="reloadBtn">🔄</button></div><div class="menu"><button id="recurringBtn">📅 ลงจองลูกค้าประจำ / รายเดือน</button><button id="clearSessionBtn">🚪 ออกจากระบบ</button></div><div id="schedule" style="overflow:auto"></div></div></main>

<div id="bookingModal" class="modal"><div class="sheet"><h3>➕ ลงจองคอร์ด</h3><div id="modalSlotText" class="hint"></div><div class="field"><label>ชื่อลูกค้า</label><input id="manualName"></div><div class="field"><label>เบอร์โทร</label><input id="manualPhone"></div><div class="field"><label>หมายเหตุ</label><textarea id="manualRemark">ลงคอร์ดโดย Admin</textarea></div><div class="row"><button id="submitBookingBtn" class="green" type="button">✅ ลงจอง</button><button id="closeModalBtn" class="gray" type="button">ยกเลิก</button></div></div></div>

<div id="editModal" class="modal"><div class="sheet"><h3>✏️ แก้ไขการจอง</h3><div id="editOldText" class="hint"></div><div class="field"><label>วันที่</label><input id="editDate" type="date"></div><div class="row"><div class="field"><label>สนาม</label><select id="editCourt"><option>1</option><option>2</option><option>3</option><option>4</option></select></div><div class="field"><label>เวลาเริ่ม</label><select id="editHour"></select></div></div><div class="field"><label>ชื่อลูกค้า</label><input id="editName"></div><div class="field"><label>เบอร์โทร</label><input id="editPhone"></div><div class="field"><label>หมายเหตุ</label><textarea id="editRemark"></textarea></div><div class="row"><button id="saveEditBtn" class="blue" type="button">💾 บันทึกแก้ไข</button><button id="extendBtn" class="orange" type="button">⏰ ขยายเวลา</button></div><button id="closeEditBtn" class="gray" type="button" style="width:100%;margin-top:8px">ปิด</button><div id="editMsg"></div></div></div>

<div id="extendModal" class="modal"><div class="sheet"><h3>⏰ ขยายเวลาจอง</h3><div id="extendText" class="hint"></div><div class="field"><label>เพิ่มอีกกี่ชั่วโมง</label><select id="extendHours"><option value="1">1 ชั่วโมง</option><option value="2">2 ชั่วโมง</option><option value="3">3 ชั่วโมง</option><option value="4">4 ชั่วโมง</option></select></div><div class="hint">ระบบจะลงเวลาต่อจากเวลาปัจจุบัน และถ้ามีคนจองแล้วจะไม่เขียนทับ</div><div class="row" style="margin-top:12px"><button id="submitExtendBtn" class="orange" type="button">⏰ ขยายเวลา</button><button id="closeExtendBtn" class="gray" type="button">ยกเลิก</button></div><div id="extendMsg"></div></div></div>

<div id="recurringModal" class="modal"><div class="sheet"><h3>📅 ลูกค้าประจำ / ลงจองเป็นเดือน</h3><div class="field"><label>ชื่อลูกค้า</label><input id="recName"></div><div class="field"><label>เบอร์โทร</label><input id="recPhone"></div><div class="row"><div class="field"><label>เริ่มวันที่</label><input id="recFrom" type="date"></div><div class="field"><label>ถึงวันที่</label><input id="recTo" type="date"></div></div><div class="field"><label>สนาม</label><div class="row"><label><input type="checkbox" class="recCourt" value="1"> 1</label><label><input type="checkbox" class="recCourt" value="2"> 2</label><label><input type="checkbox" class="recCourt" value="3"> 3</label><label><input type="checkbox" class="recCourt" value="4"> 4</label></div></div><div class="field"><label>วันในสัปดาห์</label><div class="row" style="flex-wrap:wrap"><label><input type="checkbox" class="recDay" value="0"> อา</label><label><input type="checkbox" class="recDay" value="1"> จ</label><label><input type="checkbox" class="recDay" value="2"> อ</label><label><input type="checkbox" class="recDay" value="3"> พ</label><label><input type="checkbox" class="recDay" value="4"> พฤ</label><label><input type="checkbox" class="recDay" value="5"> ศ</label><label><input type="checkbox" class="recDay" value="6"> ส</label></div></div><div class="row"><div class="field"><label>เวลาเริ่ม</label><select id="recStart"></select></div><div class="field"><label>จำนวนชั่วโมง</label><select id="recDur"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></div></div><div class="hint">ระบบเดิมจะข้ามเฉพาะช่วงที่มีการจองอยู่แล้ว และรายงานจำนวนที่สร้าง/ข้าม</div><div class="row" style="margin-top:12px"><button id="submitRecurringBtn" class="green" type="button">✅ ลงจองตามรอบ</button><button id="closeRecurringBtn" class="gray" type="button">ยกเลิก</button></div><div id="recMsg"></div></div></div>

<script>
const API='https://script.google.com/macros/s/AKfycbweoPikUT3Xfqp2l9Oapg6x3FalxEFJztf9FYTcZHoXrx39tUBUUOD-3RV1HGPel95Azw/exec';
const $=id=>document.getElementById(id);let adminPassword='',bookings=[],busy=false,pendingSlot=null,editing=null,extending=null;
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok'}).format(new Date())}function pad(n){return String(n).padStart(2,'0')}function startHour(d){const x=new Date(d+'T12:00:00').getDay();return x>=1&&x<=5?11:10}
function fillHours(id,min=10,max=23){let h='';for(let i=min;i<=max;i++)h+=`<option value="${i}">${pad(i)}:00</option>`;$(id).innerHTML=h}
async function post(p){const r=await fetch(API,{method:'POST',body:new URLSearchParams(p),cache:'no-store'});const t=await r.text();try{return JSON.parse(t)}catch(e){throw Error('ระบบตอบกลับผิดรูปแบบ')}}
async function login(){const p=$('adminPassword').value.trim();if(!p)return;$('loginError').textContent='กำลังตรวจสอบ...';try{const r=await post({action:'adminLogin',password:p});if(!r.success)throw Error(r.message||'เข้าสู่ระบบไม่สำเร็จ');adminPassword=p;sessionStorage.setItem('smAdminPassword',p);$('loginView').style.display='none';$('appView').style.display='block';await loadSchedule(true)}catch(e){$('loginError').textContent='❌ '+e.message}}
function render(){const date=$('date').value,s=startHour(date),bySlot=new Map();for(const b of bookings)bySlot.set(String(b.court)+'|'+String(b.hour),b);let h='<div style="display:grid;grid-template-columns:68px repeat(4,215px);min-width:928px"><div style="background:#111827;color:white;padding:10px;text-align:center">เวลา</div>';for(let c=1;c<=4;c++)h+=`<div style="background:#111827;color:white;padding:10px;text-align:center">🏸 สนาม ${c}</div>`;for(let hour=s;hour<24;hour++){h+=`<div style="padding:8px;background:#f8fafc;text-align:center">${pad(hour)}:00</div>`;for(let c=1;c<=4;c++){const b=bySlot.get(String(c)+'|'+String(hour));if(!b)h+=`<div style="padding:5px;border:1px solid #e5e7eb"><button type="button" class="slot available" data-booking-slot="1" data-date="${date}" data-court="${c}" data-hour="${hour}">ว่าง<br><small>กดเพื่อจอง</small></button></div>`;else h+=`<div style="padding:5px;border:1px solid #e5e7eb"><button type="button" class="slot" data-booking="1" data-index="${bookings.indexOf(b)}">${String(b.name||'จองแล้ว')}<br><small>${b.status||'pending'}</small></button></div>`}}h+='</div>';$('schedule').innerHTML=h}
async function loadSchedule(force=false){if(busy)return;let d=$('date').value||today();$('date').value=d;const key='smAdminSchedule:'+d;if(!force){try{const cached=JSON.parse(localStorage.getItem(key)||'null');if(cached&&Array.isArray(cached.bookings)){bookings=cached.bookings;render()}}catch(e){}}busy=true;$('schedule').style.opacity='.65';try{const r=await post({action:'mobileAdminBookings',admin:adminPassword,date:d});if(!r.success)throw Error(r.message||'โหลดตารางไม่สำเร็จ');bookings=Array.isArray(r.bookings)?r.bookings:[];try{localStorage.setItem(key,JSON.stringify({savedAt:Date.now(),bookings}))}catch(e){}render()}catch(e){if(!bookings.length)$('schedule').innerHTML=`<div style="padding:20px;color:#b91c1c">❌ ${e.message}</div>`}finally{$('schedule').style.opacity='1';busy=false}}
function openBookingModal(date,court,hour){pendingSlot={date,court:String(court),hour:String(hour)};$('modalSlotText').textContent=`${date} • สนาม ${court} • ${pad(hour)}:00–${pad(Number(hour)+1)}:00`;$('manualName').value='';$('manualPhone').value='';$('manualRemark').value='ลงคอร์ดโดย Admin';$('bookingModal').classList.add('open')}
function closeModal(){pendingSlot=null;$('bookingModal').classList.remove('open')}
async function submitManualBooking(){if(!pendingSlot)return;const name=$('manualName').value.trim(),phone=$('manualPhone').value.trim(),remark=$('manualRemark').value.trim();if(!name||!phone){alert('กรุณากรอกชื่อและเบอร์โทร');return}const btn=$('submitBookingBtn');btn.disabled=true;try{const r=await post({action:'manualBooking',admin:adminPassword,date:pendingSlot.date,court:pendingSlot.court,hour:pendingSlot.hour,name,phone,remark});if(!r.success)throw Error(r.message||'ลงจองไม่สำเร็จ');localStorage.removeItem('smAdminSchedule:'+pendingSlot.date);closeModal();await loadSchedule(true);alert('ลงจองสำเร็จ')}catch(e){alert('❌ '+e.message)}finally{btn.disabled=false}}
function openEdit(b){editing=b;$('editDate').value=String(b.date).slice(0,10);$('editCourt').value=String(b.court);fillHours('editHour');$('editHour').value=String(b.hour);$('editName').value=b.name||'';$('editPhone').value=b.phone||'';$('editRemark').value=b.remark||'';$('editOldText').textContent=`${b.date} • สนาม ${b.court} • ${pad(Number(b.hour))}:00 • ${b.name||''}`;$('editMsg').textContent='';$('editModal').classList.add('open')}
function closeEdit(){$('editModal').classList.remove('open');editing=null}
async function saveEdit(){if(!editing)return;const p={action:'adminBooking',admin:adminPassword,bookingId:editing.bookingId||'',oldDate:editing.date,oldCourt:editing.court,oldHour:editing.hour,date:$('editDate').value,court:$('editCourt').value,hour:$('editHour').value,name:$('editName').value.trim(),phone:$('editPhone').value.trim(),remark:$('editRemark').value.trim()};if(!p.name||!p.phone){$('editMsg').textContent='❌ กรุณากรอกชื่อและเบอร์โทร';return}try{const r=await post(p);if(!r.success)throw Error(r.message||'แก้ไขไม่สำเร็จ');localStorage.removeItem('smAdminSchedule:'+editing.date);localStorage.removeItem('smAdminSchedule:'+p.date);closeEdit();await loadSchedule(true);alert('แก้ไขการจองแล้ว')}catch(e){$('editMsg').textContent='❌ '+e.message}}
function openExtend(){if(!editing)return;extending=editing;$('extendText').textContent=`${editing.name||''} • สนาม ${editing.court} • ต่อจาก ${pad(Number(editing.hour)+1)}:00`;$('extendMsg').textContent='';$('extendModal').classList.add('open')}
function closeExtend(){$('extendModal').classList.remove('open');extending=null}
async function submitExtend(){if(!extending)return;const count=Number($('extendHours').value),start=Number(extending.hour)+1;if(start+count>24){$('extendMsg').textContent='❌ เวลาเกิน 24:00';return}let created=0,skipped=[];try{for(let i=0;i<count;i++){const hour=start+i;const r=await post({action:'manualBooking',admin:adminPassword,date:String(extending.date).slice(0,10),court:String(extending.court),hour:String(hour),name:extending.name||'',phone:extending.phone||'',remark:extending.remark||'ขยายเวลา'});if(r.success)created++;else skipped.push(pad(hour)+':00')}localStorage.removeItem('smAdminSchedule:'+String(extending.date).slice(0,10));closeExtend();closeEdit();await loadSchedule(true);alert(`ขยายเวลาสำเร็จ ${created} ชั่วโมง`+(skipped.length?'\nช่วงที่ลงไม่ได้: '+skipped.join(', '):''))}catch(e){$('extendMsg').textContent='❌ '+e.message}}
function openRecurring(){const d=today();$('recFrom').value=d;const x=new Date(d+'T12:00:00');x.setMonth(x.getMonth()+1);x.setDate(x.getDate()-1);$('recTo').value=[x.getFullYear(),pad(x.getMonth()+1),pad(x.getDate())].join('-');$('recName').value='';$('recPhone').value='';document.querySelectorAll('.recCourt,.recDay').forEach(x=>x.checked=false);fillHours('recStart',10,23);$('recStart').value='18';$('recDur').value='1';$('recMsg').textContent='';$('recurringModal').classList.add('open')}
function closeRecurring(){$('recurringModal').classList.remove('open')}
async function submitRecurring(){const name=$('recName').value.trim(),phone=$('recPhone').value.trim(),from=$('recFrom').value,to=$('recTo').value,courts=[...document.querySelectorAll('.recCourt:checked')].map(x=>x.value),days=[...document.querySelectorAll('.recDay:checked')].map(x=>x.value);if(!name||!phone||!from||!to||!courts.length||!days.length){$('recMsg').textContent='❌ กรุณากรอกข้อมูลให้ครบและเลือกสนาม/วัน';return}const p={action:'addRecurring',admin:adminPassword,name,phone,court:courts.join(','),start:$('recStart').value,dur:$('recDur').value,from,to,days:days.join(',')};const btn=$('submitRecurringBtn');btn.disabled=true;try{const r=await post(p);if(!r.success)throw Error(r.message||'ลงจองลูกค้าประจำไม่สำเร็จ');closeRecurring();localStorage.clear();await loadSchedule(true);alert(`${r.message||'สำเร็จ'}\nสร้าง ${r.created||0} ชั่วโมง • ข้าม ${r.skipped||0} ชั่วโมง`)}catch(e){$('recMsg').textContent='❌ '+e.message}finally{btn.disabled=false}}
function moveDate(n){const d=new Date(($('date').value||today())+'T12:00:00');d.setDate(d.getDate()+n);$('date').value=[d.getFullYear(),pad(d.getMonth()+1),pad(d.getDate())].join('-');loadSchedule(false)}function goToday(){$('date').value=today();loadSchedule(false)}
$('loginBtn').addEventListener('click',login);$('adminPassword').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('prevBtn').addEventListener('click',()=>moveDate(-1));$('nextBtn').addEventListener('click',()=>moveDate(1));$('todayBtn').addEventListener('click',goToday);$('reloadBtn').addEventListener('click',()=>loadSchedule(true));$('closeModalBtn').addEventListener('click',closeModal);$('submitBookingBtn').addEventListener('click',submitManualBooking);$('closeEditBtn').addEventListener('click',closeEdit);$('saveEditBtn').addEventListener('click',saveEdit);$('extendBtn').addEventListener('click',openExtend);$('closeExtendBtn').addEventListener('click',closeExtend);$('submitExtendBtn').addEventListener('click',submitExtend);$('recurringBtn').addEventListener('click',openRecurring);$('closeRecurringBtn').addEventListener('click',closeRecurring);$('submitRecurringBtn').addEventListener('click',submitRecurring);$('clearSessionBtn').addEventListener('click',()=>{sessionStorage.removeItem('smAdminPassword');location.reload()});$('schedule').addEventListener('click',e=>{const empty=e.target.closest('[data-booking-slot]');if(empty)return openBookingModal(empty.dataset.date,empty.dataset.court,empty.dataset.hour);const booked=e.target.closest('[data-booking]');if(booked){const b=bookings[Number(booked.dataset.index)];if(b)openEdit(b)}});$('date').value=today();fillHours('editHour');fillHours('recStart',10,23);const saved=sessionStorage.getItem('smAdminPassword');if(saved){adminPassword=saved;$('loginView').style.display='none';$('appView').style.display='block';loadSchedule(false)}
</script></body></html>
