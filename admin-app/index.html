<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>S&M Badminton Admin</title><style>body{font-family:system-ui;margin:0;background:#f3f4f6;padding-bottom:80px}button,input,textarea{font:inherit}.slot{width:100%;min-height:62px;border-radius:10px;border:1px solid #bbf7d0;background:#f0fdf4;color:#166534;font-weight:900;cursor:pointer;padding:6px;font-size:11px}.available{background:#eff6ff!important;border-color:#93c5fd!important;color:#1d4ed8!important}.past{background:#f3f4f6!important;border-color:#e5e7eb!important;color:#9ca3af!important}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.open{display:flex}.sheet{width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:16px}.field{margin-bottom:10px}.field input,.field textarea{width:100%;box-sizing:border-box;border:1px solid #e5e7eb;border-radius:10px;padding:10px}.field textarea{min-height:80px}.green{background:#16a34a;color:#fff;border:0;border-radius:9px;padding:10px 12px;font-weight:800}.gray{background:#eef2f7;color:#374151;border:0;border-radius:9px;padding:10px 12px;font-weight:800}</style></head><body>
<header style="background:#111827;color:white;padding:18px"><h1 style="margin:0">🏸 S&M Badminton Admin</h1><p>กดช่องว่างเพื่อจอง</p></header>
<main style="max-width:1100px;margin:auto;padding:10px"><div id="loginView"><h2>🔐 Admin</h2><input id="adminPassword" type="password" placeholder="รหัส Admin" style="width:100%;box-sizing:border-box;padding:12px"><button id="loginBtn" type="button" style="width:100%;margin-top:8px;padding:12px;background:#2563eb;color:#fff;border:0;border-radius:10px">เข้าสู่ระบบ</button><div id="loginError"></div></div><div id="appView" style="display:none"><div style="margin:10px 0"><button id="prevBtn" type="button">◀</button><input id="date" type="date"><button id="nextBtn" type="button">▶</button><button id="todayBtn" type="button">วันนี้</button><button id="reloadBtn" type="button">🔄</button></div><div id="schedule" style="overflow:auto"></div></div></main>
<div id="bookingModal" class="modal"><div class="sheet"><h3>➕ ลงจองคอร์ด</h3><div id="modalSlotText"></div><div class="field"><label>ชื่อลูกค้า</label><input id="manualName"></div><div class="field"><label>เบอร์โทร</label><input id="manualPhone"></div><div class="field"><label>หมายเหตุ</label><textarea id="manualRemark">ลงคอร์ดโดย Admin</textarea></div><button id="submitBookingBtn" class="green" type="button">✅ ลงจอง</button> <button id="closeModalBtn" class="gray" type="button">ยกเลิก</button></div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbweoPikUT3Xfqp2l9Oapg6x3FalxEFJztf9FYTcZHoXrx39tUBUUOD-3RV1HGPel95Azw/exec';
const $=id=>document.getElementById(id);let adminPassword='',bookings=[],busy=false,pendingSlot=null;
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok'}).format(new Date())}
function pad(n){return String(n).padStart(2,'0')}
function startHour(d){const x=new Date(d+'T12:00:00').getDay();return x>=1&&x<=5?11:10}
async function post(p){const r=await fetch(API,{method:'POST',body:new URLSearchParams(p),cache:'no-store'});const t=await r.text();try{return JSON.parse(t)}catch(e){throw Error('ระบบตอบกลับผิดรูปแบบ') }}
async function login(){const p=$('adminPassword').value.trim();if(!p)return;$('loginError').textContent='กำลังตรวจสอบ...';try{const r=await post({action:'adminLogin',password:p});if(!r.success)throw Error(r.message||'เข้าสู่ระบบไม่สำเร็จ');adminPassword=p;sessionStorage.setItem('smAdminPassword',p);$('loginView').style.display='none';$('appView').style.display='block';await loadSchedule(true)}catch(e){$('loginError').textContent='❌ '+e.message}}
function render(){const date=$('date').value,s=startHour(date);const bySlot=new Map();for(const b of bookings){bySlot.set(String(b.court)+'|'+String(b.hour),b)}let h='<div style="display:grid;grid-template-columns:68px repeat(4,215px);min-width:928px">';h+='<div style="background:#111827;color:white;padding:10px;text-align:center">เวลา</div>';for(let c=1;c<=4;c++)h+=`<div style="background:#111827;color:white;padding:10px;text-align:center">🏸 สนาม ${c}</div>`;for(let hour=s;hour<24;hour++){h+=`<div style="padding:8px;background:#f8fafc;text-align:center">${pad(hour)}:00</div>`;for(let c=1;c<=4;c++){const b=bySlot.get(String(c)+'|'+String(hour));if(!b){h+=`<div style="padding:5px;border:1px solid #e5e7eb"><button type="button" class="slot available" data-booking-slot="1" data-date="${date}" data-court="${c}" data-hour="${hour}">ว่าง<br><small>กดเพื่อจอง</small></button></div>`}else{h+=`<div style="padding:5px;border:1px solid #e5e7eb"><button type="button" class="slot">${String(b.name||'จองแล้ว')}</button></div>`}}}h+='</div>';$('schedule').innerHTML=h}
async function loadSchedule(force=false){if(busy)return;let d=$('date').value||today();$('date').value=d;const key='smAdminSchedule:'+d;if(!force){try{const cached=JSON.parse(localStorage.getItem(key)||'null');if(cached&&Array.isArray(cached.bookings)){bookings=cached.bookings;render();}}catch(e){}}busy=true;$('schedule').style.opacity='.65';try{const r=await post({action:'mobileAdminBookings',admin:adminPassword,date:d});if(!r.success)throw Error(r.message||'โหลดตารางไม่สำเร็จ');bookings=Array.isArray(r.bookings)?r.bookings:[];try{localStorage.setItem(key,JSON.stringify({savedAt:Date.now(),bookings}))}catch(e){}render()}catch(e){if(!bookings.length)$('schedule').innerHTML=`<div style="padding:20px;color:#b91c1c">❌ ${e.message}</div>`}finally{$('schedule').style.opacity='1';busy=false}}
function openBookingModal(date,court,hour){pendingSlot={date,court:String(court),hour:String(hour)};$('modalSlotText').textContent=`${date} • สนาม ${court} • ${pad(hour)}:00–${pad(Number(hour)+1)}:00`;$('manualName').value='';$('manualPhone').value='';$('manualRemark').value='ลงคอร์ดโดย Admin';$('bookingModal').classList.add('open')}
function closeModal(){pendingSlot=null;$('bookingModal').classList.remove('open')}
async function submitManualBooking(){if(!pendingSlot)return;const name=$('manualName').value.trim(),phone=$('manualPhone').value.trim(),remark=$('manualRemark').value.trim();if(!name||!phone){alert('กรุณากรอกชื่อและเบอร์โทร');return}const btn=$('submitBookingBtn');btn.disabled=true;try{const r=await post({action:'manualBooking',admin:adminPassword,date:pendingSlot.date,court:pendingSlot.court,hour:pendingSlot.hour,name,phone,remark});if(!r.success)throw Error(r.message||'ลงจองไม่สำเร็จ');try{localStorage.removeItem('smAdminSchedule:'+pendingSlot.date)}catch(e){}closeModal();await loadSchedule(true);alert('ลงจองสำเร็จ')}catch(e){alert('❌ '+e.message)}finally{btn.disabled=false}}
function moveDate(n){const d=new Date(($('date').value||today())+'T12:00:00');d.setDate(d.getDate()+n);$('date').value=[d.getFullYear(),pad(d.getMonth()+1),pad(d.getDate())].join('-');loadSchedule(false)}function goToday(){$('date').value=today();loadSchedule(false)}
$('loginBtn').addEventListener('click',login);$('adminPassword').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('prevBtn').addEventListener('click',()=>moveDate(-1));$('nextBtn').addEventListener('click',()=>moveDate(1));$('todayBtn').addEventListener('click',goToday);$('reloadBtn').addEventListener('click',()=>loadSchedule(true));$('closeModalBtn').addEventListener('click',closeModal);$('submitBookingBtn').addEventListener('click',submitManualBooking);$('schedule').addEventListener('click',e=>{const b=e.target.closest('[data-booking-slot]');if(!b)return;openBookingModal(b.dataset.date,b.dataset.court,b.dataset.hour)});$('date').value=today();const saved=sessionStorage.getItem('smAdminPassword');if(saved){adminPassword=saved;$('loginView').style.display='none';$('appView').style.display='block';loadSchedule(false)}
</script></body></html>
